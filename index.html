<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Neomancer — tuning in.">
  <meta name="color-scheme" content="dark">
  <title>Neomancer</title>
  <style>
    :root {
      --bg: #050508;
      --neon: #ff2bd6;
      --cyan: #2ef5ff;
      --text: #f5f0ff;
      --muted: #a89bb8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 30% 40%, rgba(255, 43, 214, 0.18) 0%, transparent 42%),
        radial-gradient(circle at 70% 65%, rgba(46, 245, 255, 0.14) 0%, transparent 40%),
        var(--bg);
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 26rem; }
    .sigil {
      width: 4rem; height: 4rem; margin: 0 auto 1.4rem;
      border: 2px solid var(--neon);
      border-radius: 1rem;
      transform: rotate(45deg);
      box-shadow:
        0 0 20px rgba(255, 43, 214, 0.55),
        inset 0 0 16px rgba(46, 245, 255, 0.25);
      position: relative;
    }
    .sigil::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid var(--cyan);
      border-radius: 0.4rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(120deg, var(--neon), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.75rem;
    }
    .status {
      font-size: 0.95rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 1.15rem;
      text-shadow: 0 0 18px rgba(46, 245, 255, 0.45);
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }
    .domains {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: rgba(168, 155, 184, 0.75);
    }
  </style>
</head>
<body>
  <main>
    <div class="sigil" aria-hidden="true"></div>
    <h1>Neomancer</h1>
    <p class="status">Tuning in</p>
    <p>Streams, signals, and whatever else is brewing.</p>
    <p class="domains">neomancer.ca · neomancer.tech</p>
  </main>
</body>
</html>
